name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portfolio-react/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-react/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-react
        run: npm ci

      - name: Build
        working-directory: portfolio-react
        run: npm run build

      # GitHub Pages has no server-side rewrites, so a direct visit or
      # refresh on a client-side route (e.g. /case-study) would 404. The
      # standard fallback: GitHub Pages serves 404.html for any unmatched
      # path, so making it an identical copy of index.html lets the app's
      # own JS load and React Router take over from the real URL.
      - name: Add SPA fallback for client-side routes
        run: cp portfolio-react/dist/index.html portfolio-react/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
